<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020406" />
    <meta name="description" content="An interactive globe by Brayden Gutowski." />
    <title>Brayden Gutowski | Earth</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23020406' stroke='%23f3f5f3'/%3E%3Cpath d='M5 15h22M16 3c5 5 5 21 0 26M16 3c-5 5-5 21 0 26' fill='none' stroke='%23f3f5f3' stroke-width='1'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" id="app">
      <div class="star-field" aria-hidden="true"></div>

      <header class="site-header">
        <a class="wordmark" href="#" aria-label="Brayden Gutowski dot dev, home">
          <svg viewBox="0 0 1200 200" role="img" aria-labelledby="wordmark-title">
            <title id="wordmark-title">Brayden Gutowski.dev</title>
            <defs>
              <linearGradient id="wordmark-accent-gradient" gradientUnits="userSpaceOnUse" x1="690" y1="0" x2="1040" y2="0">
                <stop offset="0%" stop-color="#ef4f5f" />
                <stop offset="48%" stop-color="#c34f8f" />
                <stop offset="100%" stop-color="#8654c7" />
              </linearGradient>
              <filter id="wordmark-halo-blur" x="-65%" y="-260%" width="230%" height="620%">
                <feGaussianBlur stdDeviation="30" />
              </filter>
              <filter id="wordmark-accent-blur" x="-260%" y="-420%" width="620%" height="940%">
                <feGaussianBlur stdDeviation="13" result="accent-inner" />
                <feGaussianBlur stdDeviation="34" result="accent-outer" />
                <feComponentTransfer in="accent-outer" result="accent-outer-soft">
                  <feFuncA type="linear" slope="0.56" />
                </feComponentTransfer>
                <feMerge>
                  <feMergeNode in="accent-outer-soft" />
                  <feMergeNode in="accent-inner" />
                </feMerge>
              </filter>
            </defs>
            <path class="wordmark__path" id="wordmark-path" d="M 60 92 Q 600 92 1140 92" />
            <text class="wordmark__halo" aria-hidden="true">
              <textPath href="#wordmark-path" startOffset="50%" text-anchor="middle">Brayden Gutowski<tspan class="wordmark__suffix" dx="0.18em">.dev</tspan></textPath>
            </text>
            <text class="wordmark__accent-glow" aria-hidden="true">
              <textPath href="#wordmark-path" startOffset="50%" text-anchor="middle"><tspan class="wordmark__accent-spacer">Brayden Gu</tspan><tspan class="wordmark__accent-color">towski</tspan><tspan class="wordmark__suffix wordmark__accent-color" dx="0.18em">.dev</tspan></textPath>
            </text>
            <text class="wordmark__text">
              <textPath href="#wordmark-path" startOffset="50%" text-anchor="middle">Brayden Gutowski<tspan class="wordmark__suffix" dx="0.18em">.dev</tspan></textPath>
            </text>
          </svg>
        </a>
      </header>

      <section class="globe-stage" id="globe-stage" aria-label="Interactive 3D globe">
        <canvas id="globe-canvas"></canvas>
        <div class="canvas-fallback" id="canvas-fallback" hidden>
          <p>WebGL could not start on this device.</p>
          <p>Try enabling hardware acceleration or opening this page in a current browser.</p>
        </div>
      </section>

      <aside class="location-panel" id="location-panel" aria-live="polite" aria-hidden="true">
        <button class="icon-button location-panel__close" id="close-panel" type="button" aria-label="Close location details">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
        <p class="eyebrow" id="location-kicker">Selected location</p>
        <h1 id="location-heading">Profile</h1>
        <p class="location-panel__subheading" id="location-subheading"></p>
        <p class="location-panel__detail" id="location-detail"></p>
        <p class="location-panel__lede" id="location-description"></p>
        <div class="panel-actions" id="location-actions"></div>
      </aside>

      <aside class="content-drawer" id="content-drawer" aria-live="polite" aria-hidden="true">
        <button class="icon-button content-drawer__close" id="close-drawer" type="button" aria-label="Close portfolio drawer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
        <p class="eyebrow" id="drawer-kicker">Portfolio</p>
        <h2 id="drawer-title">Projects</h2>
        <p class="content-drawer__intro" id="drawer-description"></p>
        <div class="drawer-content" id="drawer-content"></div>
      </aside>

      <div class="interaction-guide" id="interaction-guide">
        <svg class="interaction-guide__arrow" viewBox="0 0 24 24" aria-hidden="true">
          <path class="interaction-guide__scroll-arrow" d="M12 19V5M6.5 10.5 12 5l5.5 5.5" />
          <g class="interaction-guide__pinch-arrows">
            <path class="interaction-guide__pinch-arrow interaction-guide__pinch-arrow--out" d="M10 10 5 5m0 0h5M5 5v5" />
            <path class="interaction-guide__pinch-arrow interaction-guide__pinch-arrow--in" d="m14 14 5 5m0 0v-5m0 5h-5" />
          </g>
        </svg>
        <p>
          <span class="interaction-guide__desktop-copy">Scroll through the stars</span>
          <span class="interaction-guide__mobile-copy">Pinch through the stars</span>
        </p>
      </div>

      <nav class="location-nav" aria-label="Featured locations">
        <span class="location-nav__label">Locations</span>
        <button class="location-link" type="button" data-location="gainesville">
          <span class="location-link__dot" aria-hidden="true"></span>
          <span class="location-link__text">Florida <span class="location-link__separator" aria-hidden="true">•</span> Computer Science</span>
        </button>
        <button class="location-link" type="button" data-location="tokyo">
          <span class="location-link__dot" aria-hidden="true"></span>
          <span class="location-link__text">Japan <span class="location-link__separator" aria-hidden="true">•</span> Language Studies</span>
        </button>
      </nav>

      <div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
        <div class="loading-screen__content">
          <p class="loading-screen__title">Loading Towski.dev</p>
          <div class="progress-track" aria-hidden="true"><span id="load-progress"></span></div>
          <p class="loading-screen__status" id="load-status">Preparing the scene</p>
        </div>
      </div>
    </main>

    <noscript>This interactive globe requires JavaScript.</noscript>
    <script type="module" src="script.js?v=20260820-florida"></script>
  </body>
</html>
